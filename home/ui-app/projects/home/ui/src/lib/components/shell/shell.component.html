<div class="flex h-dvh app-shell-bg">
  <!-- Main content -->
  <div class="flex flex-col flex-1 lg:pl-64 min-w-0">
    <main class="flex-1 overflow-y-auto pb-24 lg:pb-6">
      <header class="lg:hidden sticky top-0 z-30 px-4 pt-4 pb-3 app-surface border-b app-border">
        <div class="flex items-center justify-between gap-3">
          <div>
            <p class="text-sm font-semibold app-text">{{ config.appName }}</p>
            <p class="text-xs app-text-muted">Appearance</p>
          </div>
          <div class="flex gap-1.5 rounded-2xl p-1 app-theme-group">
            @for (mode of themeService.themeModes; track mode.value) {
              <button
                type="button"
                (click)="setMode(mode.value)"
                [class]="
                  themeService.isActive(mode.value)
                    ? 'app-theme-option-active rounded-xl px-3 py-2 text-xs font-semibold min-h-[44px]'
                    : 'app-theme-option rounded-xl px-3 py-2 text-xs font-semibold min-h-[44px]'
                "
                [attr.aria-label]="'Switch to ' + mode.label + ' mode'"
              >
                @switch (mode.icon) {
                  @case ('light') {
                    <ng-icon name="heroSunSolid"/>
                  }
                  @case ('dark') {
                    <ng-icon name="heroMoonSolid"/>
                  }
                  @default {
                    <ng-icon name="heroQuestionMarkCircleSolid"/>
                  }
                }
              </button>
            }
          </div>
        </div>
      </header>
      <router-outlet/>
    </main>
  </div>

  @if (navigationService.sideNavRoutes().length) {
    <app-mobile-sidenav/>
  }

  <!-- Mobile bottom tab bar -->
  <app-mobile-bottom-nav/>

  <app-toast-container/>
</div>
