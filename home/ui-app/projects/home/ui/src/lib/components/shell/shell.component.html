<div class="relative flex h-dvh app-shell-bg">
  @if (seasonal) {
    <app-seasonal-background [intensity]="seasonalTheme.fullDecorations() ? 'full' : 'soft'" />
  }
  <!-- Desktop sidebar -->
  <app-desktop-sidenav/>

  <!-- Main content -->
  <div class="flex flex-col flex-1 min-w-0" [class]="contentClass()">
    <main class="flex-1" [class]="mainClass()">
      <!-- Stays a direct child of <main>: theme.css's party styles select it that way. -->
      <header class="lg:hidden z-30 px-4 app-surface border-b app-border" [class]="headerClass()">
        <div class="flex items-center gap-2">
          @if (homeLink) {
            <a
              href="/"
              class="app-icon-button -my-1 -ml-2 flex min-h-[36px] min-w-[36px] shrink-0 items-center justify-center rounded-lg"
              aria-label="Home"
              title="Home"
            >
              <ng-icon name="heroHomeSolid" aria-hidden="true"/>
            </a>
          }
          <div class="flex flex-1 min-w-0 items-baseline gap-2">
            <p class="min-w-0 shrink-0 max-w-[60%] truncate text-sm font-semibold app-text">{{ config.appName }}</p>
            <!-- Collapsed: still say which household this is. -->
            @if (compactAccount && layout.headerCollapsed()) {
              <div class="min-w-0 flex-1">
                <ng-container *ngComponentOutlet="compactAccount; inputs: { variant: 'header' }" />
              </div>
            }
          </div>
          @if (account && layout.collapsible()) {
            <button
              type="button"
              class="app-icon-button -my-1 -mr-2 flex min-h-[36px] min-w-[36px] items-center justify-center rounded-lg"
              aria-controls="shell-header-account"
              [attr.aria-expanded]="!layout.headerCollapsed()"
              [attr.aria-label]="layout.headerCollapsed() ? 'Show household' : 'Hide household'"
              (click)="layout.toggleHeader()"
            >
              <ng-icon [name]="layout.headerCollapsed() ? 'heroChevronDownSolid' : 'heroChevronUpSolid'"/>
            </button>
          }
        </div>
        @if (account) {
          <div id="shell-header-account" class="mt-3" [hidden]="layout.headerCollapsed()">
            <ng-container *ngComponentOutlet="account" />
          </div>
        }
      </header>
      <router-outlet/>
    </main>
  </div>

  <!-- Mobile bottom tab bar -->
  <app-mobile-bottom-nav/>

  <app-toast-container/>
</div>
