@if (open()) {
  <div class="fixed inset-0 z-50 lg:hidden" role="dialog" aria-modal="true">
    <div
      class="absolute inset-0"
      style="background-color: var(--theme-overlay)"
      (click)="closeRequested.emit()"
    ></div>
    <div
      class="absolute bottom-0 left-0 right-0 app-surface rounded-t-2xl max-h-[90dvh] overflow-y-auto flex flex-col border-t app-border"
    >
      <div
        class="flex items-center justify-between px-4 py-3 border-b app-border sticky top-0 app-surface z-10 shrink-0"
      >
        <h3 class="text-lg font-semibold app-text">{{ title() }}</h3>
        <button
          type="button"
          (click)="closeRequested.emit()"
          class="app-icon-button flex items-center justify-center w-11 h-11 rounded-full transition-colors"
          aria-label="Close"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="p-4 overflow-y-auto">
        <ng-content />
      </div>
    </div>
  </div>
}
